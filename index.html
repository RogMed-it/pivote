<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pivote · Calculadora de matrices paso a paso</title>
    <meta name="description" content="Calculadora de matrices con procedimiento paso a paso: Gauss-Jordan, determinantes, inversa, valores y vectores propios, LU. Fracciones exactas y números complejos. Exporta a LaTeX y PDF." />
    <meta name="theme-color" content="#0b0e17" />
    <meta property="og:title" content="Pivote · Álgebra lineal paso a paso" />
    <meta property="og:description" content="Resuelve matrices con fracciones exactas y complejos, y ve cada operación de renglón. Hecho para estudiantes de ingeniería." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <script>
      try {
        const t = localStorage.getItem('pivote.theme');
        if (t) document.documentElement.dataset.theme = t;
        else if (matchMedia('(prefers-color-scheme: light)').matches) document.documentElement.dataset.theme = 'light';
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Pivote necesita JavaScript para calcular.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
